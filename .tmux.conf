# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
set-option -g repeat-time 0
bind-key C-a send-prefix

# split panes using | and -
bind | split-window -h
bind - split-window -v
#unbind '"'
unbind %

# switch panes using Alt-arrow without prefix
#bind -n M-Left select-pane -L
#bind -n M-Right select-pane -R
#bind -n M-Up select-pane -U
#bind -n M-Down select-pane -D

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'

set -g @continuum-restore 'on'

######################
### DESIGN CHANGES ###
######################
set -g status-style 'bg=colour238'
set -g status-left '#[fg=colour234,bg=colour2,bold] tmux #[fg=colour2,bg=colour238]'
set -g status-left-length 40

# panes
set -g pane-border-style 'fg=colour15 bg=colour0'
set -g pane-active-border-style 'bg=colour0 fg=colour10'

# window indicators
set -g window-status-separator ''
setw -g window-status-current-style ''
setw -g window-status-current-format '#[fg=colour238,bg=colour2]#[fg=colour234,bg=colour2,bold] #I:#W #[fg=colour2,bg=colour238]'
setw -g window-status-style ''
setw -g window-status-format '#[fg=colour15,bg=colour238]  #I#[fg=colour2,bg=colour238]:#W #[fg=colour238,bg=colour238]'

# date / time indicators
set -g status-right '#[fg=colour237,bg=colour238]#[fg=colour2,bg=colour237] %a, %d %b #[fg=colour2,bg=colour237]#[fg=colour237,bg=colour2,bold] %H:%M:%S '

# promt
set -g message-style 'fg=colour10 bg=colour238'
set -g message-command-style 'fg=colour10 bg=colour238'

#set -g default-terminal "tmux-256color"

set -g mouse on
set -g repeat-time 0

set -g @scroll-speed-num-lines-per-scroll 1
setw -g xterm-keys on

set-option -g default-shell /bin/bash

# macOS clipboard integration
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
set -g status-interval 1

